name: GTM Learn

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *" # daily at 6am UTC

permissions:
  contents: write

jobs:
  analyze-and-coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run analyze
      - run: npm run coach
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated metrics and playbook
        run: |
          git config user.name "gtmteam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ config/playbook.md
          git diff --cached --quiet || git commit -m "chore: analyst/coach run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
